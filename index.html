/* actions */
async function post(t,a,ty){const r=await sb.from('messages').insert({channel_id:S.cid,content:t||'',attachment:a||null,att_type:ty||null,reply_to:S.rp?.id||null}).select().single();

async function send(e){e.preventDefault();const i=$('#in'),t=i.value.trim();if(!t)return false;i.value='';await post(t);return false}
async function attach(el){const f=el.files[0];if(!f)return;if(f.size>52428800){alert('Files must be under 50 MB.');return}toast('Uploading...');const u=await up(el,'chat');el.value='';
 if(u){const i=$('#in'),t=i.value.trim();i.value='';await post(t,u,f.type.startsWith('video')?'video':'image')}}
async function del(id){if(LS('cdel')&&!confirm('Delete this message?'))return;if((await sb.from('messages').delete().eq('id',id)).error)return;$('#m'+id)?.remove();S.msgs=S.msgs.filter(m=>m.id!=id)}

async function rx(id,e){const mine=S.rx.find(r=>r.message_id==id&&r.user_id==S.uid&&r.emoji==e);
 if(mine){S.rx=S.rx.filter(r=>r!==mine);rm(id);await sb.from('reactions').delete().eq('message_id',id).eq('user_id',S.uid).eq('emoji',e)}else{S.rx.push({message_id:id,user_id:S.uid,emoji:e});rm(id);await sb.from('reactions').insert({message_id:id,emoji:e})}}

 :`<h2>Customize Your Server</h2><p class=mut>Give your new server a personality with a name and an icon. You can always change it later.</p><label class=upl style="justify-self:center"><input type=file accept="image/*" hidden onchange="S.nf=this.files[0];$('#pv').innerHTML='<img src='+URL.createObjectURL(S.nf)+'>'"><div id=pv class=pv>📷<small>Upload</small></div></label><label style="text-align:left">Server name<input id=nn maxlength=40 value="${esc(S.me.username)}'s server"></label><div class=btnrow><a onclick="srvModal(0)">Back</a><button class=btn onclick="mkS()">Create</button></div>`)+`</div></div>`)}

 if(S.nf){const u=await up({files:[S.nf]},'srv');if(u)await sb.from('servers').update({icon_url:u}).eq('id',r.data)}await addS(r.data)}

async function addS(id){const m=await sb.from('servers').select('*').eq('id',id).single();closeM();if(!S.servers.some(x=>x.id==id))S.servers.push(m.data);S.em=(await sb.from('server_emojis').select('*')).data||[];go(id)}
function chModal(){modal(`<div class=ov onclick="event.target==this&&closeM()"><div class=box><h2>Create channel</h2><form onsubmit="return mkc(event)"><label>Type<select id=ck><option value=text># Text</option><option value=voice>🔊 Voice</option></select></label><label>Name<input id=cn placeholder="new-channel" required maxlength=30></label><br><button class=btn>Create channel</button></form></div></div>`)}

 if(r.error)alert(r.error.message);else{closeM();S.chans.push(r.data);k=='voice'?render():opn(r.data.id)}return false}

 const r=await sb.from('servers').update({name:($('#sn')?.value||sv.name).trim(),description:$('#sd')?.value??sv.description,...ps,...p}).eq('id',sv.id).select().single();
 if(r.error)return alert(r.error.message);Object.assign(sv,r.data);render();srvSet(pg||'pf')}

 const u=await up(el,'emoji');if(!u)return;const r=await sb.from('server_emojis').insert({server_id:S.sid,name:n,url:u}).select().single();if(r.error)return alert(r.error.message);S.em.push(r.data);srvSet('emo')}

  <div style="width:290px"><div class=card id=pvw>${bnH(sv.banner_url,sv.banner_color,sv.banner_pos,'banner_pos')}<div class=av2>${ico(sv,72)}</div><div class=pb><h3>${esc(sv.name)}</h3><span class=mut>${S.mem.length} Members · Est. ${new Date(sv.created_at).toLocaleDateString(undefined,{month:'short',year:'numeric'})}</span><div>${esc(sv.description)}</div></div></div></div></div>`,
 roles:`<h2>Roles</h2><p class=mut>Roles color names and grant permissions. Assign them on the Members page.</p><div class=two><div style="width:200px">${S.roles.map(r=>`<div class="ch ${r.id==ro?.id?'on':''}" onclick="srvSet('roles','${r.id}')"><i class=sw2 style="background:${esc(r.color)}"></i>${esc(r.name)}</div>`).join('')}<button class="btn ghost" style="margin-top:8px" onclick="newR()">+ Create Role</button></div>
  <div style="flex:1;min-width:260px">${ro?`<label>Role name<input id=rn value="${esc(ro.name)}" maxlength=30></label><label>Role color<input type=color id=rcl value="${esc(ro.color)}"></label><label>Permissions</label>${PERMS.map(([k,n])=>`<label class=ck><input type=checkbox class=rp value=${k} ${ro.perms.includes(k)?'checked':''}> ${n}</label>`).join('')}<br><button class=btn onclick="saveR('${ro.id}')">Save</button> <button class="btn red" onclick="delR('${ro.id}')">Delete Role</button>`:'<p class=mut>No roles yet. Create one to get started.</p>'}</div></div>`,
 mem:`<h2>Members</h2><p class=mut>${can('manage_roles')?'Click a role to give or remove it.':''}</p>${S.mem.map(i=>`<div class=fr>${av(S.P[i],32)}<div class=fi><b ${rc(i)}>${esc(S.P[i]?.username)}</b>${i==sv.owner_id?' 👑':''}<div>${can('manage_roles')?S.roles.map(r=>`<span class="chip ${S.mr.some(x=>x.user_id==i&&x.role_id==r.id)?'on':''}" style="--c:${esc(r.color)}" onclick="tr('${i}','${r.id}')">${esc(r.name)}</span>`).join(''):''}</div></div>${can('kick')&&i!=S.uid&&i!=sv.owner_id?`<button class="btn red" style="margin:0" onclick="kick('${i}')">Kick</button>`:''}</div>`).join('')}`,
 emo:`<h2>Emoji</h2><p class=mut>Upload custom emoji for this server. Members use them by typing :name: or from the emoji picker.</p><label>Emoji name (optional)<input id=en placeholder="e.g. party_cat" maxlength=32></label><br><label class="btn upl">Upload Emoji<input type=file accept="image/*" hidden onchange="addE(this)"></label><label>${mine.length} emoji</label>${mine.map(e=>`<div class=fr><img class=em style="width:36px;height:36px" src="${esc(e.url)}"><div class=fi>:${esc(e.name)}:</div><button class=ic onclick="delE('${e.id}')">✕</button></div>`).join('')}`,
 chn:`<h2>Channels</h2><p class=mut>Rename channels, set a topic, or delete them.</p>${S.chans.map(c=>`<div class=fr><div class=fi><div class=th><input id="cn_${c.id}" value="${esc(c.name)}" maxlength=30 style="width:170px"><input id="ct_${c.id}" value="${esc(c.topic||'')}" placeholder="Topic" maxlength=200 style="flex:1;min-width:140px"></div></div><button class=btn onclick="saveC('${c.id}')">Save</button><button class=ic onclick="delC('${c.id}')">${ic('x',16)}</button></div>`).join('')}`,
 disc:`<h2>Discovery</h2><p class=mut>Let people find ${esc(sv.name)} in the Discover tab and join without an invite code.</p>${tg('Enable Discovery','Show this server in Discover. A description helps people decide to join.',sv.discoverable,'tgD(this)')}<label>Category<select onchange="ssave({category:this.value},'disc')">${CATS.map(c=>`<option ${sv.category==c?'selected':''}>${c}</option>`).join('')}</select></label>${sv.description?'':'<p class=mut style="margin-top:12px">Tip: add a description on the Server Profile page.</p>'}`,
 chat:`<h2>Chat</h2>${tg('Show images from links','Display image and GIF links inline.',LS('li')!==false,"tglL('li',this)")}${tg('Show role colors','Color usernames by their role.',LS('rcol')!==false,"tglL('rcol',this)")}${tg('Confirm before deleting','Ask before deleting a message.',LS('cdel')===true,"tglL('cdel',this)")}`,
 voice:`<h2>Voice & Video</h2><p class=mut>Applies the next time you join a call.</p>${tg('Echo cancellation','Reduce echo from your speakers.',LS('ec')!==false,"tglL('ec',this)")}${tg('Noise suppression','Filter out background noise.',LS('ns')!==false,"tglL('ns',this)")}${tg('Automatic gain control','Keep your volume steady.',LS('agc')!==false,"tglL('agc',this)")}${tg('Join calls muted','Start every call with your microphone off.',LS('jm')===true,"tglL('jm',this)")}`,
 ntf:`<h2>Notifications</h2>${tg('Mute server','Hide the unread dot for this server. Pings still show.',(LS('ms')||[]).includes(sv.id),'muteS(this)')}`,
 inv:`<h2>Invites</h2><p class=mut>Share this code. People join with the + button.</p><div class=row><b style="font-size:26px">${sv.invite}</b><button class=btn onclick="navigator.clipboard.writeText('${sv.invite}');this.textContent='Copied!'">Copy</button></div>`,

 lv:`<h2>Leave Server</h2><p class=mut>You can rejoin later with an invite code.</p><button class="btn red" onclick="rmS(false)">Leave Server</button>`};
 shell(nav,pg[tab],tab,'srvSet',`<p class=mut style="padding:0 10px 8px;font-size:13px">${esc(sv.name)}</p>`)}

 const r=await sb.from('profiles').update({color:$('#pc')?.value||S.me.color,bio:$('#pb')?.value??S.me.bio,status:$('#ps')?.value??S.me.status,...ps,...p}).eq('id',S.uid).select().single();if(r.error)return alert(r.error.message);S.me=S.P[S.uid]=r.data;render();settings('pr')}

 S.allCh.forEach(c=>{if(!l[c.id])l[c.id]=now;old=Math.min(old,T(l[c.id]))});LS('lr',l);
 const r=(await sb.from('messages').select('channel_id,created_at,content,user_id').gt('created_at',new Date(Math.max(old,Date.now()-14*864e5)).toISOString()).neq('user_id',S.uid).limit(1000)).data||[];
 r.forEach(m=>{const c=S.allCh.find(x=>x.id==m.channel_id);if(!c||c.kind=='voice'||T(m.created_at)<=T(l[c.id]))return;S.un[c.id]=(S.un[c.id]||0)+1;if(!c.server_id||isPing(m.content))S.pg[c.id]=(S.pg[c.id]||0)+1})}
async function onMsg(m){
 if(m.channel_id==S.cid){if(!S.msgs.some(x=>x.id==m.id)){await prof([m.user_id]);S.msgs.push(m);addMsg(m)}if(m.user_id!=S.uid){ping(m,isPing(m.content));markRead(m.channel_id,m.created_at)}return}

 if(!c){c=(await sb.from('channels').select('*').eq('id',m.channel_id).maybeSingle()).data;if(!c)return;S.allCh.push(c)}
 if(c.kind=='voice')return;await prof([m.user_id,...(c.dm_users||[])]);const pg=!c.server_id||isPing(m.content);
 S.un[c.id]=(S.un[c.id]||0)+1;if(pg)S.pg[c.id]=(S.pg[c.id]||0)+1;if(!c.server_id){unhide(c.id);if(!S.dms.some(x=>x.id==c.id))S.dms.push(c)}

/* calls: WebRTC peer-to-peer, signaling through Supabase Realtime */
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]},bc=(ch,ev,p)=>ch.send({type:'broadcast',event:ev,payload:p});

async function joinRoom(room,video,peer){if(S.call)endCall(true);let ls;
 try{ls=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:LS('ec')!==false,noiseSuppression:LS('ns')!==false,autoGainControl:LS('agc')!==false},video:!!video})}catch(e){alert('Could not access your microphone'+(video?' or camera':'')+'. Allow it in your browser, and make sure the site is on https.');return false}
 if(LS('jm')&&!S.muted){S.muted=true;render()}ls.getAudioTracks().forEach(t=>t.enabled=!S.muted);const call=S.call={room,video:!!video,peer,ls,peers:{},rs:{}},ch=call.ch=sb.channel('call:'+room,{config:{presence:{key:S.uid}}});
 ch.on('presence',{event:'sync'},async()=>{const ids=Object.keys(ch.presenceState()).filter(i=>i!=S.uid);if(ids.length){call.had=1;clearTimeout(call.ringing)}
   ids.forEach(i=>{if(!call.peers[i]&&S.uid>i)offer(i)});Object.keys(call.peers).forEach(i=>{if(!ids.includes(i))drop(i)});
   if(call.peer&&call.had&&!ids.length){toast('Call ended');endCall(true);return}await prof(ids);callUI()})
  .on('broadcast',{event:'sig'},({payload:p})=>{if(p.to==S.uid)onSig(p)}).subscribe(s=>{if(s=='SUBSCRIBED')ch.track({t:Date.now()})});
 callUI();return true}
function mkPC(id){const c=S.call,p=new RTCPeerConnection(ICE);c.peers[id]=p;p.q=[];c.ls.getTracks().forEach(t=>p.addTrack(t,c.ls));
 p.onicecandidate=e=>e.candidate&&bc(c.ch,'sig',{to:id,from:S.uid,ice:e.candidate});p.ontrack=e=>{c.rs[id]=e.streams[0];callUI()};
 p.onconnectionstatechange=()=>{if(p.connectionState=='failed')toast('A connection failed. Their network may need a TURN server.')};return p}
async function offer(id){const p=mkPC(id),o=await p.createOffer();await p.setLocalDescription(o);bc(S.call.ch,'sig',{to:id,from:S.uid,sdp:p.localDescription})}
async function onSig(m){const c=S.call;if(!c)return;const p=c.peers[m.from]||mkPC(m.from);
 if(m.sdp){await p.setRemoteDescription(m.sdp);for(const i of p.q.splice(0))await p.addIceCandidate(i);if(m.sdp.type=='offer'){const a=await p.createAnswer();await p.setLocalDescription(a);bc(c.ch,'sig',{to:m.from,from:S.uid,sdp:p.localDescription})}}
 else if(m.ice){p.remoteDescription?await p.addIceCandidate(m.ice):p.q.push(m.ice)}}
function drop(i){const c=S.call;c.peers[i]?.close();delete c.peers[i];delete c.rs[i]}
function endCall(q){const c=S.call;if(!c)return;clearTimeout(c.ringing);if(!q&&!c.had)(c.others||[]).forEach(i=>bc(S.pc,'hang',{to:i,room:c.room}));S.vs?.untrack();Object.keys(c.peers).forEach(drop);c.ls.getTracks().forEach(t=>t.stop());sb.removeChannel(c.ch);S.call=null;callUI()}
function callUI(){let w=$('#cw');if(!S.call){w?.remove();return}if(!w){w=document.createElement('div');w.id='cw';document.body.append(w)}
 const c=S.call,ids=[...new Set([...Object.keys(c.rs),...Object.keys(c.peers)])];
 w.innerHTML=`<div class=tiles>${ids.map(i=>`<div class=tile data-i="${i}"><video autoplay playsinline data-r=1></video><span>${esc(S.P[i]?.username||'...')}</span></div>`).join('')}${c.video?`<div class="tile"><video autoplay playsinline muted></video><span>You</span></div>`:''}</div><div class=cbar><span>${ic(c.peer?'ph':'vol',16)} ${ids.length?(ids.length+1)+' in call':'Calling...'}</span><button class=ic onclick="togMute()">${ic('mic',18,S.muted)}</button><button class=ic onclick="togDeaf()">${ic('hp',18,S.deaf)}</button>${c.video?`<button class=ic onclick="camC(this)">${ic('vc',18)}</button>`:''}<button class=ic style="background:#da373c;color:#fff;padding:0 10px" onclick="endCall()">Leave</button></div>`;
 w.querySelectorAll('.tile').forEach(t=>{const i=t.dataset.i,v=t.querySelector('video');v.srcObject=i?c.rs[i]||null:c.ls;if(i)v.muted=!!S.deaf})}

function onRing(p){if(p.to!=S.uid)return;if(S.call){bc(S.pc,'hang',{to:p.from,room:p.room,busy:1});return}
 S.inc=p;prof([p.from]).then(ringUI);clearInterval(S.rg);S.rg=setInterval(()=>beep(520),1600);setTimeout(()=>S.inc?.room==p.room&&dismiss(),45000)}

async function tgD(el){el.classList.toggle('on');const r=await sb.from('servers').update({discoverable:el.classList.contains('on')}).eq('id',S.sid).select().single();if(r.error){el.classList.toggle('on');return alert(r.error.message)}Object.assign(S.servers.find(x=>x.id==S.sid),r.data)}
function muteS(el){el.classList.toggle('on');const l=(LS('ms')||[]).filter(x=>x!=S.sid);if(el.classList.contains('on'))l.push(S.sid);LS('ms',l);render()}
async function saveC(id){const n=$('#cn_'+id).value.trim().toLowerCase().replace(/\s+/g,'-'),t=$('#ct_'+id).value.trim();if(!n)return;const r=await sb.from('channels').update({name:n,topic:t}).eq('id',id).select().single();if(r.error)return alert(r.error.message);Object.assign(S.chans.find(c=>c.id==id),r.data);render();srvSet('chn')}
async function tgP(c,el){el.classList.toggle('on');S.me[c]=el.classList.contains('on');await sb.from('profiles').update({[c]:S.me[c]}).eq('id',S.uid)}
theme();
</script></body></html>
