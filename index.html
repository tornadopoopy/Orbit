.bdg{background:#da373c;color:#fff;border-radius:10px;padding:0 6px;font-size:12px;font-weight:700}
.fl{flex:1;overflow-y:auto;padding:8px 20px}.fr{display:flex;align-items:center;gap:12px;padding:10px 8px;border-top:1px solid var(--ln)}.fr:hover{background:var(--hov);border-radius:8px}.fi{flex:1}.fr .pt{position:relative;display:block}

.btnrow{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.sws{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.sw{height:40px;border-radius:6px;cursor:pointer;border:2px solid transparent}.sw:hover{border-color:var(--tx)}
label.btn{display:inline-block;margin:0;color:#fff;font-size:15px}select{background:var(--bg3);color:var(--tx);border:0;border-radius:6px;padding:11px 12px;font:inherit;width:100%}
.compact .msg{padding:0 8px}.compact .msg .av{width:24px!important;height:24px!important}
.av{overflow:hidden}.bn{overflow:hidden}.fit{width:100%;height:100%;display:block}.ri .fit{border-radius:0}
input[type=checkbox]{width:auto}input[type=range]{padding:0;background:none}.ck{display:flex;align-items:center;gap:8px;text-transform:none;font-size:14px;color:var(--tx);font-weight:500;margin:6px 0}.pos{display:grid;gap:2px;margin-top:6px}
label.lb{margin:0;display:grid;place-items:center;font-size:16px;color:var(--tx);cursor:pointer}

@media(max-width:800px){.mem{display:none}.side{width:170px}}

 ['--bg','--bg2','--bg3','--tx','--mut','--hov'].forEach(v=>r.style.removeProperty(v));st('--acc',t.a);

  S.chans=c.data||[];S.mem=(m.data||[]).map(y=>y.user_id);S.roles=r.data||[];S.mr=x.data||[];await prof(S.mem);
  (c=>c?opn(c.id):render())(S.chans.find(c=>c.kind!='voice'))}}

 S.msgs=((await sb.from('messages').select('*').eq('channel_id',cid).order('created_at',{ascending:false}).limit(60)).data||[]).reverse();await prof(S.msgs.map(m=>m.user_id));
 S.rx=S.msgs.length?(await sb.from('reactions').select('*').in('message_id',S.msgs.map(m=>m.id))).data||[]:[];render();

 S.rt=sb.channel('c'+cid).on('postgres_changes',{event:'INSERT',...f},async p=>{if(S.msgs.some(m=>m.id==p.new.id))return;await prof([p.new.user_id]);S.msgs.push(p.new);addMsg(p.new);if(p.new.user_id!=S.uid)ping(p.new)})
  .on('postgres_changes',{event:'UPDATE',...f},p=>{const m=S.msgs.find(x=>x.id==p.new.id);if(m){Object.assign(m,p.new);rm(m.id)}})

async function delC(id){if(!confirm('Delete this channel and its messages?'))return;const e=(await sb.from('channels').delete().eq('id',id)).error;if(e)return alert(e.message);S.chans=S.chans.filter(c=>c.id!=id);if(S.cid==id)S.cid=null;render();srvSet('chn')}
function srvSet(tab,rid){const sv=S.servers.find(x=>x.id==S.sid),own=sv.owner_id==S.uid,sw=['#3ba99c','#ff1493','#e51c1c','#e87722','#e8c233','#7b3fa0','#0aa0ff','#40e0c8','#4a7a00','#555555'];
 const nav=[...(can('manage_server')?[['pf','Server Profile']]:[]),...(can('manage_roles')?[['roles','Roles'],['mem','Members']]:can('kick')?[['mem','Members']]:[]),...(can('manage_emojis')?[['emo','Emoji']]:[]),...(can('manage_channels')?[['chn','Channels']]:[]),['inv','Invites'],own?['del','Delete Server']:['lv','Leave Server']];
 tab=tab||nav[0][0];const ro=S.roles.find(x=>x.id==rid)||S.roles[0],mine=S.em.filter(e=>e.server_id==sv.id);
 const pg={pf:`<h2>Server Profile</h2><p class=mut>Customize how your server appears to members.</p><div class=two><div style="flex:1;min-width:260px"><label>Name<input id=sn value="${esc(sv.name)}" maxlength=40></label><label>Icon (image or GIF)</label>${upb('Upload Icon','icon_url','sup','ssave({icon_url:null})',"ssave({icon_url:u,icon_pos:{}})")}${sv.icon_url?sl('icon_pos',sv.icon_pos):''}<label>Banner</label><div class=sws>${sw.map(c=>`<div class=sw style="background:linear-gradient(${c},#0008)" onclick="ssave({banner_color:'${c}',banner_url:null})"></div>`).join('')}</div><div style="margin-top:8px">${upb('Upload Banner','banner_url','sup','ssave({banner_url:null})',"ssave({banner_url:u,banner_pos:{}})")}</div>${sv.banner_url?sl('banner_pos',sv.banner_pos):''}<label>Description<textarea id=sd maxlength=300 placeholder="Tell the world a bit about this server.">${esc(sv.description)}</textarea></label><br><button class=btn onclick="ssave()">Save changes</button></div>
  <div style="width:290px"><div class=card id=pvw>${bnH(sv.banner_url,sv.banner_color,sv.banner_pos,'banner_pos')}<div class=av2>${ico(sv,72)}</div><div class=pb><h3>${esc(sv.name)}</h3><span class=mut>${S.mem.length} Members · Est. ${new Date(sv.created_at).toLocaleDateString(undefined,{month:'short',year:'numeric'})}</span><div>${esc(sv.description)}</div></div></div></div></div>`,
 roles:`<h2>Roles</h2><p class=mut>Roles color names and grant permissions. Assign them on the Members page.</p><div class=two><div style="width:200px">${S.roles.map(r=>`<div class="ch ${r.id==ro?.id?'on':''}" onclick="srvSet('roles','${r.id}')"><i class=sw2 style="background:${esc(r.color)}"></i>${esc(r.name)}</div>`).join('')}<button class="btn ghost" style="margin-top:8px" onclick="newR()">+ Create Role</button></div>
  <div style="flex:1;min-width:260px">${ro?`<label>Role name<input id=rn value="${esc(ro.name)}" maxlength=30></label><label>Role color<input type=color id=rcl value="${esc(ro.color)}"></label><label>Permissions</label>${PERMS.map(([k,n])=>`<label class=ck><input type=checkbox class=rp value=${k} ${ro.perms.includes(k)?'checked':''}> ${n}</label>`).join('')}<br><button class=btn onclick="saveR('${ro.id}')">Save</button> <button class="btn red" onclick="delR('${ro.id}')">Delete Role</button>`:'<p class=mut>No roles yet. Create one to get started.</p>'}</div></div>`,
 mem:`<h2>Members</h2><p class=mut>${can('manage_roles')?'Click a role to give or remove it.':''}</p>${S.mem.map(i=>`<div class=fr>${av(S.P[i],32)}<div class=fi><b ${rc(i)}>${esc(S.P[i]?.username)}</b>${i==sv.owner_id?' 👑':''}<div>${can('manage_roles')?S.roles.map(r=>`<span class="chip ${S.mr.some(x=>x.user_id==i&&x.role_id==r.id)?'on':''}" style="--c:${esc(r.color)}" onclick="tr('${i}','${r.id}')">${esc(r.name)}</span>`).join(''):''}</div></div>${can('kick')&&i!=S.uid&&i!=sv.owner_id?`<button class="btn red" style="margin:0" onclick="kick('${i}')">Kick</button>`:''}</div>`).join('')}`,
 emo:`<h2>Emoji</h2><p class=mut>Upload custom emoji for this server. Members use them by typing :name: or from the emoji picker.</p><label>Emoji name (optional)<input id=en placeholder="e.g. party_cat" maxlength=32></label><br><label class="btn upl">Upload Emoji<input type=file accept="image/*" hidden onchange="addE(this)"></label><label>${mine.length} emoji</label>${mine.map(e=>`<div class=fr><img class=em style="width:36px;height:36px" src="${esc(e.url)}"><div class=fi>:${esc(e.name)}:</div><button class=ic onclick="delE('${e.id}')">✕</button></div>`).join('')}`,
 chn:`<h2>Channels</h2>${S.chans.map(c=>`<div class=fr><div class=fi>${c.kind=='voice'?'🔊':'#'} ${esc(c.name)}</div><button class=ic onclick="delC('${c.id}')">✕</button></div>`).join('')}`,
 inv:`<h2>Invites</h2><p class=mut>Share this code. People join with the + button.</p><div class=row><b style="font-size:26px">${sv.invite}</b><button class=btn onclick="navigator.clipboard.writeText('${sv.invite}');this.textContent='Copied!'">Copy</button></div>`,
 del:`<h2>Delete Server</h2><p class=mut>This permanently deletes ${esc(sv.name)} with all its channels and messages.</p><button class="btn red" onclick="rmS(true)">Delete Server</button>`,
 lv:`<h2>Leave Server</h2><p class=mut>You can rejoin later with an invite code.</p><button class="btn red" onclick="rmS(false)">Leave Server</button>`};
 shell(nav,pg[tab],tab,'srvSet',`<p class=mut style="padding:0 10px 8px;font-size:13px">${esc(sv.name)}</p>`)}

/* profiles + user settings */
const pcard=(u,btn='',note=false,pv=false)=>`<div class=card ${pv?'id=pvw':''}>${bnH(u.banner_url,u.color,u.banner_pos,'banner_pos')}<div class=av2>${av(u,84)}</div><div class=pb><div class=btns>${btn}</div><h2>${esc(u.username)}</h2>${u.status?`<div class=mut>${esc(u.status)}</div>`:''}<label>About me</label><div>${esc(u.bio)||'<span class=mut>Nothing here yet.</span>'}</div><label>Member since</label><div>${new Date(u.created_at).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})}</div>${note?`<label>Note (only visible to you)</label><textarea placeholder="Click to add a note" oninput="LS('n${u.id}',this.value)">${esc(LS('n'+u.id)||'')}</textarea>`:''}</div></div>`;
async function prf(id){await prof([id]);const u=S.P[id];if(u)modal(`<div class=ov onclick="event.target==this&&closeM()">${pcard(u,id==S.uid?`<button class=btn onclick="settings('pr')">✎ Edit Profile</button>`:`<button class=btn onclick="startDM('${id}')">Message</button>`,true)}</div>`)}
async function pset(p){const ps={};['avatar_pos','banner_pos'].forEach(k=>{if($('#'+k+'x'))ps[k]=gp(k)});
 const r=await sb.from('profiles').update({color:$('#pc')?.value||S.me.color,bio:$('#pb')?.value??S.me.bio,status:$('#ps')?.value??S.me.status,...ps,...p}).eq('id',S.uid).select().single();if(r.error)return alert(r.error.message);S.me=S.P[S.uid]=r.data;render();settings('pr')}
async function pup(el,c){const u=await up(el,c);if(u)pset({[c]:u,[pk2(c)]:{}})}
async function setU(){const n=$('#un').value.trim();if(!/^[A-Za-z0-9_.]{3,20}$/.test(n))return alert('Usernames are 3-20 letters, numbers, _ or .');const r=await sb.from('profiles').update({username:n}).eq('id',S.uid).select().single();if(r.error)return alert(r.error.message.includes('duplicate')?'That username is taken.':r.error.message);S.me=S.P[S.uid]=r.data;render();settings('acc')}
async function tgl(el){el.classList.toggle('on');S.me.allow_dms=el.classList.contains('on');await sb.from('profiles').update({allow_dms:S.me.allow_dms}).eq('id',S.uid)}
function tglL(k,el){el.classList.toggle('on');const v=el.classList.contains('on');LS(k,v);if(k=='inv')v?S.pc?.untrack():S.pc?.track({t:Date.now()});if(k=='dsk'&&v)Notification.requestPermission();theme()}
const tg=(t,d,on,fn)=>`<div class=row><div><b>${t}</b><div class=mut>${d}</div></div><div class="tg ${on?'on':''}" onclick="${fn}"></div></div>`;
function settings(tab='acc'){const T={...D,...LS('theme')};
 const pg={
 acc:`<h2>My Account</h2><label>Username</label><div class=th><input id=un value="${esc(S.me.username)}" maxlength=20 style="width:260px"><button class=btn onclick="setU()">Change</button></div><div class=row><div><b>Email</b><div class=mut>${esc(S.email)}</div></div></div><button class="btn red" onclick="closeM();sb.auth.signOut()">Log out</button>`,
 pr:`<h2>Profiles</h2><div class=two><div style="flex:1;min-width:260px"><label>Avatar (image or GIF)</label>${upb('Upload Avatar','avatar_url','pup','pset({avatar_url:null})',"pset({avatar_url:u,avatar_pos:{}})")}${S.me.avatar_url?sl('avatar_pos',S.me.avatar_pos):''}<label>Banner (image or GIF)</label>${upb('Upload Banner','banner_url','pup','pset({banner_url:null})',"pset({banner_url:u,banner_pos:{}})")}${S.me.banner_url?sl('banner_pos',S.me.banner_pos):''}<label>Profile color<input type=color id=pc value="${esc(S.me.color)}"></label><label>Custom status<input id=ps maxlength=100 value="${esc(S.me.status)}" placeholder="What are you up to?"></label><label>About me<textarea id=pb maxlength=200>${esc(S.me.bio)}</textarea></label><br><button class=btn onclick="pset({})">Save changes</button></div><div style="width:290px">${pcard(S.me,'',false,true)}</div></div>`,
 soc:`<h2>Content & Social</h2><label>Social permissions</label>${tg('Direct messages','Allow DMs from other Orbit members.',S.me.allow_dms,'tgl(this)')}`,
 ntf:`<h2>Notifications</h2>${tg('Message sounds','Play a sound when someone posts in the channel you have open.',LS('snd')!==false,"tglL('snd',this)")}${tg('Desktop notifications','Show a notification when Orbit is in the background.',LS('dsk')===true,"tglL('dsk',this)")}`,
 priv:`<h2>Status & Privacy</h2>${tg('Appear offline','Hide your online status from everyone.',LS('inv')===true,"tglL('inv',this)")}`,
 app:`<h2>Appearance</h2><label>Theme</label><div class=th>${[['dark','Dark'],['darker','Darker'],['light','Light'],['custom','Custom']].map(([k,n])=>`<button class="btn ${T.m==k?'':'ghost'}" onclick="setT({m:'${k}'});settings('app')">${n}</button>`).join('')}</div>
  <label>Accent color<input type=color value="${T.a}" oninput="setT({a:this.value})"></label><label>Custom background color<input type=color value="${T.b}" oninput="setT({m:'custom',b:this.value})"></label><p class=mut style="margin:12px 0">Picking a background color switches you to your custom theme.</p><label>Chat font size<input type=range min=12 max=22 value="${LS('fs')||15}" oninput="LS('fs',+this.value);theme()"></label>${tg('Compact mode','Tighter message spacing.',LS('compact')===true,"tglL('compact',this)")}${tg('24-hour time','Show message times in 24-hour format.',LS('h24')===true,"tglL('h24',this)")}`};
 shell([['acc','My Account'],['pr','Profiles'],['soc','Content & Social'],['ntf','Notifications'],['priv','Status & Privacy'],['app','Appearance']],pg[tab],tab,'settings')}
theme();
</script></body></html>
