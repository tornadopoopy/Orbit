.pointer{cursor:pointer}.set section{max-width:960px}.two{display:flex;gap:32px;flex-wrap:wrap}

label.btn{display:inline-block;margin:0;color:#fff;font-size:15px}select{background:var(--bg3);color:var(--tx);border:0;border-radius:6px;padding:11px 12px;font:inherit;width:100%}

.av{overflow:hidden}.bn{overflow:hidden}.fit{width:100%;height:100%;display:block}.ri .fit{border-radius:0}

const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]},bc=(ch,ev,p)=>ch.send({type:'broadcast',event:ev,payload:p});

async function joinRoom(room,video,peer){if(S.call)endCall(true);let ls;
 try{ls=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:LS('ec')!==false,noiseSuppression:LS('ns')!==false,autoGainControl:LS('agc')!==false},video:!!video})}catch(e){alert('Could not access your microphone'+(video?' or camera':'')+'. Allow it in your browser, and make sure the site is on https.');return false}
 if(LS('jm')&&!S.muted)S.muted=true;ls.getAudioTracks().forEach(t=>t.enabled=!S.muted);
 const call=S.call={room,peer,ls,cam:!!video,peers:{},rs:{},scr:null,big:false,vad:{}},ch=call.ch=sb.channel('call:'+room,{config:{presence:{key:S.uid}}});
 ch.on('presence',{event:'sync'},async()=>{const ids=Object.keys(ch.presenceState()).filter(i=>i!=S.uid);if(ids.length){call.had=1;clearTimeout(call.ringing)}
   ids.forEach(i=>{if(!call.peers[i]&&S.uid>i)mkPC(i)});Object.keys(call.peers).forEach(i=>{if(!ids.includes(i))drop(i)});
   if(call.peer&&call.had&&!ids.length){toast('Call ended');endCall(true);return}await prof(ids);callUI()})
  .on('broadcast',{event:'sig'},({payload:p})=>{if(p.to==S.uid)onSig(p)}).subscribe(s=>{if(s=='SUBSCRIBED')callTrack()});
 call.vadT=setInterval(vadTick,250);rr();return true}

/* perfect negotiation: either side may add/remove tracks (camera, screen share) at any time */
function mkPC(id){const c=S.call,p=new RTCPeerConnection(ICE);c.peers[id]=p;p.q=[];p.polite=S.uid<id;
 c.ls.getTracks().forEach(t=>p.addTrack(t,c.ls));if(c.scr)c.scr.getTracks().forEach(t=>p.addTrack(t,c.scr));
 p.onnegotiationneeded=async()=>{try{p.mk=1;await p.setLocalDescription();bc(c.ch,'sig',{to:id,from:S.uid,sdp:p.localDescription})}catch(e){}finally{p.mk=0}};
 p.onicecandidate=e=>e.candidate&&bc(c.ch,'sig',{to:id,from:S.uid,ice:e.candidate});
 p.ontrack=e=>{const st=e.streams[0];if(!st)return;const l=c.rs[id]=c.rs[id]||[];if(!l.includes(st))l.push(st);st.onremovetrack=()=>callUI();callUI()};
 p.onconnectionstatechange=()=>{if(p.connectionState=='failed')toast('A connection failed. Their network may need a TURN server.')};return p}
async function onSig(m){const c=S.call;if(!c)return;const p=c.peers[m.from]||mkPC(m.from);
 try{if(m.sdp){const col=m.sdp.type=='offer'&&(p.mk||p.signalingState!='stable');p.ign=!p.polite&&col;if(p.ign)return;
   await p.setRemoteDescription(m.sdp);for(const i of p.q.splice(0))await p.addIceCandidate(i).catch(()=>{});

function reply(id){S.rp=S.msgs.find(m=>m.id==id);const v=$('#in')?.value;render();if(v)$('#in').value=v}
function rq(id){const o=S.msgs.find(x=>x.id==id),u=o&&S.P[o.user_id];return `<div class=rq onclick="document.getElementById('m${id}')?.scrollIntoView({block:'center'})">${ic('rep',12)} ${o?`<b>${esc(u?.username)}</b> ${esc(pvT(o.content).slice(0,80))}`:'Original message'}</div>`}
const sidePanel=u=>!u?'':`<div class="mem sp" style="width:320px;padding:0"><div class=spc>${bnH(u.banner_url,u.color,u.banner_pos,'banner_pos')}<div class=spa>${av(u,84)}<i class="dot big ${S.on.has(u.id)?'g':''}"></i></div><div class=spb><h2>${esc(u.username)}</h2><div class=sub>${esc(u.username)}${u.status?' • '+esc(u.status):''}</div>${S.mut[u.id]!=null?`<div class=mut style="margin:10px 0;font-size:13px">${S.mut[u.id]} Mutual Server${S.mut[u.id]==1?'':'s'}</div>`:''}${u.bio?`<div class=bio>${esc(u.bio)}</div>`:''}<label>Member Since</label><div>${new Date(u.created_at).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})}</div></div></div><div style="padding:12px"><button class="btn ghost" style="width:100%" onclick="prf('${u.id}')">View Full Profile</button></div></div>`;
const grpPanel=c=>`<div class=mem style="width:300px"><div class=lbl>Members — ${c.dm_users.length}</div>${c.dm_users.map(i=>`<div class=ch onclick="prf('${i}')">${av(S.P[i],32)} <span>${esc(S.P[i]?.username)}</span>${S.on.has(i)?'':'<span class=mut style="font-size:12px">offline</span>'}</div>`).join('')}</div>`;
function mutF(cid){const c=S.dms.find(x=>x.id==cid);if(!c||isGrp(c))return;const o=c.dm_users.find(i=>i!=S.uid);if(S.mut[o]!=null)return;
 sb.from('members').select('server_id',{count:'exact',head:true}).eq('user_id',o).then(r=>{S.mut[o]=r.count||0;if(S.cid==cid){const v=$('#in')?.value;render();if(v)$('#in').value=v}})}
const rolesH=i=>{const mine=S.mr.filter(x=>x.user_id==i).map(x=>S.roles.find(r=>r.id==x.role_id)).filter(Boolean);
 return `<label>Roles</label><div class=rl>${mine.map(r=>`<span class="chip on" style="--c:${esc(r.color)}">${esc(r.name)}</span>`).join('')}${can('manage_roles')?`<span class="chip add" onclick="this.nextElementSibling.classList.toggle('show')" title="Add or remove roles">+</span><div class=rmenu>${S.roles.map(r=>`<div class=ch onclick="tr('${i}','${r.id}',1)"><i class=sw2 style="background:${esc(r.color)}"></i>${esc(r.name)}${S.mr.some(x=>x.user_id==i&&x.role_id==r.id)?'<span style="margin-left:auto">✓</span>':''}</div>`).join('')||'<p class=mut style="padding:6px">No roles yet.</p>'}</div>`:''}</div>`};

/* voice channels + DM calls */
function vsSub(sid){if(S.vs){sb.removeChannel(S.vs);S.vs=null}S.vp={};if(sid=='home')return;const ch=S.vs=sb.channel('vs:'+sid,{config:{presence:{key:S.uid}}});
 ch.on('presence',{event:'sync'},async()=>{const st=ch.presenceState(),v={};for(const u in st){const c=st[u][st[u].length-1]?.vc;if(c)(v[c]=v[c]||[]).push(u)}S.vp=v;await prof(Object.keys(st));if(S.sid==sid&&S.me&&!$('.set,.ov')){const q=$('#in')?.value;render();if(q)$('#in').value=q}})
  .subscribe(s=>{if(s=='SUBSCRIBED'&&S.call?.vc&&S.call.vsid==sid)ch.track({vc:S.call.vc})})}
function viewVC(id){S.vcv=id;S.cid=null;S.rp=null;S.hv=null;rr()}
async function joinVC(id){if(!await joinRoom(id,0))return;S.call.vc=id;S.call.vsid=S.sid;S.vs?.track({vc:id});S.vcv=id;S.cid=null;rr();callUI()}
function vcMain(){const ch=S.chans.find(x=>x.id==S.vcv);if(!ch)return `<div class=mid><p class=mut>That channel is gone.</p></div>`;const ps=S.vp[ch.id]||[],hd=`<div class=hd>${ic('vol',20)}&nbsp;${esc(ch.name)}</div>`;
 if(S.call&&S.call.room==ch.id)return hd+`<div class=vcmain><div id=cps></div></div>`;
 return hd+`<div class=vcjoin><h2>${esc(ch.name)}</h2><p class=mut>${ps.length?ps.length+' in voice right now':'No one is in here yet.'}</p><div style="display:flex;gap:6px">${ps.map(u=>av(S.P[u],40)).join('')}</div><button class=btn onclick="joinVC('${ch.id}')">Join Voice</button></div>`}
async function callDM(video){const c=S.dms.find(x=>x.id==S.cid);if(!c)return;const others=c.dm_users.filter(i=>i!=S.uid),room=c.id;
 if(!await joinRoom(room,video,others.length==1?others[0]:null))return;S.call.others=others;callUI();others.forEach(i=>bc(S.pc,'ring',{to:i,from:S.uid,room,video:!!video}));
 S.call.ringing=setTimeout(()=>{if(S.call?.room==room&&!S.call.had){others.forEach(i=>bc(S.pc,'hang',{to:i,room}));toast('No answer');endCall(true)}},45000)}

/* discovery */
const CATS=['Gaming','Music','Education','Science & Tech','Entertainment','Art','Community','Other'];
const dgH=()=>(S.dl||[]).map(v=>`<div class=dcard>${bnH(v.banner_url,v.banner_color,v.banner_pos,'banner_pos')}<div class=av2 style="margin-top:-28px">${ico(v,56)}</div><div class=pb><b>${esc(v.name)}</b><div class=mut style="min-height:40px">${esc(v.description)||'No description yet.'}</div><small class=mut>${v.members} member${v.members==1?'':'s'} · ${esc(v.category)}</small>${v.joined?`<button class="btn ghost" onclick="go('${v.id}')">Open</button>`:`<button class=btn onclick="joinP('${v.id}')">Join</button>`}</div></div>`).join('')||'<p class=mut>No servers found. Server owners can turn on Discovery in Server Settings.</p>';
const discH=()=>`<div class=hd>${ic('cmp',22)}&nbsp;Discover Servers</div><div class=fl><div class=th style="margin:8px 0"><input id=dq placeholder="Search servers" value="${esc(S.dq||'')}" oninput="clearTimeout(S.gt);S.gt=setTimeout(()=>{S.dq=this.value;dsc()},300)" style="max-width:320px"><button class="btn ${S.dc?'ghost':''}" onclick="S.dc='';render();dsc()">All</button>${CATS.map(c=>`<button class="btn ${S.dc==c?'':'ghost'}" onclick="S.dc='${c}';render();dsc()">${c}</button>`).join('')}</div><div id=dg class=dgrid>${dgH()}</div></div>`;
async function dsc(){const r=await sb.rpc('discover',{q:S.dq||'',cat:S.dc||''});S.dl=r.data||[];const g=$('#dg');if(g)g.innerHTML=dgH()}
async function openDisc(){if(S.sid!='home')await go('home');S.cid=null;S.hv='disc';render();dsc()}
async function joinP(id){const r=await sb.rpc('join_public',{sid:id});if(r.error)return alert(r.error.message);await addS(r.data)}
async function tgD(el){el.classList.toggle('on');const r=await sb.from('servers').update({discoverable:el.classList.contains('on')}).eq('id',S.sid).select().single();if(r.error){el.classList.toggle('on');return alert(r.error.message)}Object.assign(S.servers.find(x=>x.id==S.sid),r.data)}
function muteS(el){el.classList.toggle('on');const l=(LS('ms')||[]).filter(x=>x!=S.sid);if(el.classList.contains('on'))l.push(S.sid);LS('ms',l);render()}
async function saveC(id){const n=$('#cn_'+id).value.trim().toLowerCase().replace(/\s+/g,'-'),t=$('#ct_'+id).value.trim();if(!n)return;const r=await sb.from('channels').update({name:n,topic:t,category_id:$('#cg_'+id).value||null}).eq('id',id).select().single();if(r.error)return alert(r.error.message);Object.assign(S.chans.find(c=>c.id==id),r.data);render();srvSet('chn')}
async function tgP(c,el){el.classList.toggle('on');S.me[c]=el.classList.contains('on');await sb.from('profiles').update({[c]:S.me[c]}).eq('id',S.uid)}
theme();
</script></body></html>
