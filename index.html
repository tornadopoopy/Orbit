<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orbit Chat</title><link rel="icon">
<style>
:root{--bg:#313338;--bg2:#2b2d31;--bg3:#1e1f22;--tx:#f2f3f5;--mut:#949ba4;--acc:#5865f2;--hov:#ffffff14;--ln:#0004}
[data-theme=darker]{--bg:#1a1b1e;--bg2:#121316;--bg3:#0a0b0c}
[data-theme=light]{--bg:#fff;--bg2:#f2f3f5;--bg3:#e3e5e8;--tx:#2e3338;--mut:#5c6068;--hov:#0000000f;--ln:#0002}
*{box-sizing:border-box;margin:0}
body{font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--tx);height:100vh;overflow:hidden}
#app{display:flex;height:100vh}
.rail{width:72px;background:var(--bg3);padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:8px;overflow-y:auto;flex:none}
.rail hr{width:32px;border:0;border-top:2px solid var(--hov)}
.ri{width:48px;height:48px;border-radius:50%;background:var(--bg);display:grid;place-items:center;cursor:pointer;font-weight:700;overflow:hidden;transition:border-radius .15s;flex:none}
.ri:hover,.ri.on{border-radius:16px;background:var(--acc);color:#fff}.ri svg{width:100%;height:100%}.ri.add{color:#3ba55d;font-size:26px}.ri.add:hover{color:#fff;background:#3ba55d}
.side{width:240px;background:var(--bg2);display:flex;flex-direction:column;flex:none}
.sh,.hd{height:48px;padding:0 16px;display:flex;align-items:center;font-weight:700;border-bottom:1px solid var(--ln);flex:none}
.sl{flex:1;overflow-y:auto;padding:8px}
.ch{padding:6px 8px;border-radius:4px;color:var(--mut);cursor:pointer;display:flex;align-items:center;gap:8px}.ch:hover,.ch.on{background:var(--hov);color:var(--tx)}
.lbl{font-size:12px;font-weight:700;color:var(--mut);padding:8px;display:flex;justify-content:space-between}.lbl span{cursor:pointer;font-size:18px;line-height:1}
.inv{font-size:12px;color:var(--mut);padding:8px 16px;cursor:pointer;border-bottom:1px solid var(--ln)}.inv b{color:var(--tx)}
.me{background:var(--bg3);padding:8px;display:flex;align-items:center;gap:8px;flex:none}.me b{flex:1;cursor:pointer;overflow:hidden;text-overflow:ellipsis}.me i{cursor:pointer;font-style:normal;font-size:18px;color:var(--mut)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
#msgs{flex:1;overflow-y:auto;padding:16px 8px}
.msg{display:flex;gap:12px;padding:4px 8px;border-radius:4px;position:relative}.msg:hover{background:var(--hov)}.msg small{color:var(--mut);font-size:12px}.msg b,.pt{cursor:pointer}
.ct{white-space:pre-wrap;word-break:break-word}
.x{display:none;position:absolute;right:8px;top:4px;cursor:pointer;font-style:normal;color:var(--mut)}.msg:hover .x{display:block}
.bar{padding:0 16px 24px;flex:none}
input,textarea{background:var(--bg3);color:var(--tx);border:0;border-radius:6px;padding:11px 12px;font:inherit;outline:0;width:100%}textarea{min-height:70px;resize:vertical}
input[type=color]{padding:0;height:40px;width:80px;cursor:pointer}
.btn{background:var(--acc);color:#fff;border:0;border-radius:4px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}.btn:hover{filter:brightness(1.1)}.btn.ghost{background:var(--hov);color:var(--tx)}.btn.red{background:#da373c;margin-top:20px}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;text-shadow:0 1px 2px #0006}
.mem{width:220px;background:var(--bg2);padding:8px;overflow-y:auto;flex:none}
.mid{flex:1;display:grid;place-content:center;justify-items:center;text-align:center;gap:12px;padding:24px}.mid form{display:flex;gap:8px;width:min(380px,90vw)}
.mut{color:var(--mut)}
label{display:grid;gap:6px;font-size:12px;font-weight:700;color:var(--mut);margin:14px 0 4px}
.logo svg{width:64px;height:64px;border-radius:14px}.mid .logo svg{width:84px;height:84px}
.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:9}
.box,.card{background:var(--bg);border-radius:8px;width:min(440px,92vw);padding:20px;box-shadow:0 8px 40px #0008;display:grid;gap:8px}
.card{padding:0;background:var(--bg2);overflow:hidden;gap:0}.bn{height:100px}.av2{margin:-44px 0 0 16px;width:fit-content}.av2 .av{border:6px solid var(--bg2)}
.pb{padding:8px 16px 16px;display:grid;gap:4px}.pb .btns{display:flex;justify-content:flex-end;margin-top:-40px;margin-bottom:12px}
.set{position:fixed;inset:0;background:var(--bg);display:flex;z-index:10}
.set nav{flex:0 0 min(260px,34vw);background:var(--bg2);padding:50px 12px}.set nav div{padding:8px 10px;border-radius:4px;cursor:pointer;color:var(--mut);margin-bottom:2px}.set nav .on,.set nav div:hover{background:var(--hov);color:var(--tx)}
.set section{flex:1;max-width:660px;padding:50px 40px;overflow:auto}.set h2{margin-bottom:12px}
.esc{position:absolute;top:44px;right:44px;width:38px;height:38px;border:2px solid var(--mut);border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--mut)}.esc:hover{color:var(--tx);border-color:var(--tx)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--ln)}
.tg{width:40px;height:24px;border-radius:12px;background:#80848e;position:relative;cursor:pointer;flex:none}.tg:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}.tg.on{background:#23a55a}.tg.on:after{left:19px}
.th{display:flex;gap:8px;flex-wrap:wrap}
.auth{margin:auto;display:grid;place-items:center;width:100%;height:100%;background:var(--bg3)}.auth form{background:var(--bg);padding:32px;border-radius:8px;width:min(400px,92vw);display:grid;gap:4px;justify-items:stretch}.auth .logo{justify-self:center}.auth h2{text-align:center;margin:8px 0}
#err{color:#f23f43;min-height:1.2em;font-size:13px;margin-top:6px}a{color:var(--acc);cursor:pointer}small{font-size:13px}
.pointer{cursor:pointer}.set section{max-width:960px}.two{display:flex;gap:32px;flex-wrap:wrap}
.ri img{width:100%;height:100%;object-fit:cover}.av.sq{border-radius:22px}.ch.dim{opacity:.5}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--acc);color:#fff;padding:10px 20px;border-radius:8px;font-weight:600;z-index:99;box-shadow:0 4px 20px #0006}
.bar{position:relative}#pk{position:absolute;bottom:64px;right:16px;width:min(400px,92vw);height:400px;background:var(--bg2);border-radius:8px;box-shadow:0 8px 40px #0008;display:flex;flex-direction:column;overflow:hidden;z-index:5}
.eg{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:10px;overflow-y:auto;font-size:24px;text-align:center}.eg span{cursor:pointer;border-radius:4px}.eg span:hover{background:var(--hov)}
.gg{columns:2;gap:6px;padding:10px;overflow-y:auto;flex:1}.gg img{width:100%;margin-bottom:6px;border-radius:6px;cursor:pointer;display:block}
.ib{display:flex;gap:6px;background:var(--bg3);border-radius:8px;align-items:center;padding-right:8px}.ib input{background:none}
.ic{background:var(--hov);color:var(--tx);border:0;border-radius:6px;min-width:34px;height:34px;cursor:pointer;font-weight:700;font-size:13px}.ic:hover{background:var(--acc);color:#fff}
.gif{max-width:320px;max-height:260px;border-radius:6px;display:block;margin-top:4px}
.tabs{display:flex;gap:8px;align-items:center;margin-left:16px}.tb{background:none;border:0;color:var(--mut);padding:4px 10px;border-radius:4px;font:inherit;font-weight:600;cursor:pointer}.tb:hover,.tb.on{background:var(--hov);color:var(--tx)}
.bdg{background:#da373c;color:#fff;border-radius:10px;padding:0 6px;font-size:12px;font-weight:700}
.fl{flex:1;overflow-y:auto;padding:8px 20px}.fr{display:flex;align-items:center;gap:12px;padding:10px 8px;border-top:1px solid var(--ln)}.fr:hover{background:var(--hov);border-radius:8px}.fi{flex:1}.fr .pt{position:relative;display:block}
.dot{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:#80848e;border:3px solid var(--bg)}.dot.g{background:#23a55a}
.pv{width:80px;height:80px;border:2px dashed var(--mut);border-radius:50%;display:grid;place-content:center;justify-items:center;cursor:pointer;overflow:hidden;font-size:22px}.pv img{width:80px;height:80px;object-fit:cover}.pv small{font-size:11px;font-weight:700;color:var(--mut)}
.btnrow{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.sws{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.sw{height:40px;border-radius:6px;cursor:pointer;border:2px solid transparent}.sw:hover{border-color:var(--tx)}
label.btn{display:inline-block;margin:0;color:#fff;font-size:15px}select{background:var(--bg3);color:var(--tx);border:0;border-radius:6px;padding:11px 12px;font:inherit;width:100%}
.compact .msg{padding:0 8px}.compact .msg .av{width:24px!important;height:24px!important}
@media(max-width:800px){.mem{display:none}.side{width:170px}}
</style></head><body><div id="app"></div><div id="md"></div>

const sb=supabase.createClient('https://jsjlffmpirdgrxdfwsso.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpzamxmZm1waXJkZ3J4ZGZ3c3NvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1MTEyMzUsImV4cCI6MjExMDA4NzIzNX0.MLps0MFVEyMS_Cm_DD5J5-1ycub8sK6iy7DcQl85Zxs');

$('link[rel=icon]').href='data:image/svg+xml,'+encodeURIComponent(LOGO);

const S={on:new Set(),fr:[],tab:'on',P:{},servers:[],chans:[],dms:[],mem:[],msgs:[],sid:'home'},D={m:'dark',a:'#5865f2',b:'#313338'};

/* themes */
function theme(){const t={...D,...LS('theme')},r=document.documentElement,st=(k,v)=>r.style.setProperty(k,v);r.dataset.theme=t.m;document.body.classList.toggle('compact',LS('compact')===true);
 ['--bg','--bg2','--bg3','--tx','--mut','--hov'].forEach(v=>r.style.removeProperty(v));st('--acc',t.a);
 if(t.m=='custom'){const[R,G,B]=[1,3,5].map(i=>parseInt(t.b.substr(i,2),16)),L=(R*299+G*587+B*114)/1000>140;
  st('--bg',t.b);st('--bg2',`color-mix(in srgb,${t.b},#000 ${L?6:14}%)`);st('--bg3',`color-mix(in srgb,${t.b},#000 ${L?12:30}%)`);

/* auth */
function authView(m='in'){const i=m=='in';
 app.innerHTML=`<div class=auth><form onsubmit="return doAuth(event,'${m}')"><div class=logo>${LOGO}</div><h2>${i?'Welcome back to Orbit':'Create your Orbit account'}</h2>
 ${i?'':'<label>Username<input id=u required minlength=3 maxlength=20 pattern="[A-Za-z0-9_.]+" title="Letters, numbers, _ and . only"></label>'}
 <label>Email<input id=e type=email required></label><label>Password<input id=p type=password required minlength=6></label><div id=err></div>

async function doAuth(e,m){e.preventDefault();const em=$('#e').value,pw=$('#p').value,r=m=='up'?await sb.auth.signUp({email:em,password:pw,options:{data:{username:$('#u').value}}}):await sb.auth.signInWithPassword({email:em,password:pw});
 if(r.error)$('#err').textContent=r.error.message;else if(!r.data.session)$('#err').textContent='Check your email to confirm your account, then log in.';return false}

 if(!r)return sb.auth.signOut();S.me=S.P[S.uid]=r;
 const m=await sb.from('members').select('servers(*)').eq('user_id',S.uid);S.servers=(m.data||[]).map(x=>x.servers).filter(Boolean);presence();go('home')}
async function prof(ids){const n=[...new Set(ids)].filter(i=>i&&!S.P[i]);if(n.length)((await sb.from('profiles').select('*').in('id',n)).data||[]).forEach(p=>S.P[p.id]=p)}

/* navigation */
async function go(id){S.sid=id;S.cid=null;S.msgs=[];S.mem=[];if(S.rt){sb.removeChannel(S.rt);S.rt=null}
 if(id=='home'){await loadFr();S.dms=(await sb.from('channels').select('*').is('server_id',null)).data||[];await prof(S.dms.flatMap(c=>c.dm_users));S.chans=[];render()}
 else{S.chans=(await sb.from('channels').select('*').eq('server_id',id).order('created_at')).data||[];
  S.mem=((await sb.from('members').select('user_id').eq('server_id',id)).data||[]).map(x=>x.user_id);await prof(S.mem);
  (c=>c?opn(c.id):render())(S.chans.find(c=>c.kind!='voice'))}}
async function opn(cid){S.cid=cid;if(S.rt)sb.removeChannel(S.rt);
 S.msgs=((await sb.from('messages').select('*').eq('channel_id',cid).order('created_at',{ascending:false}).limit(60)).data||[]).reverse();await prof(S.msgs.map(m=>m.user_id));render();
 S.rt=sb.channel('c'+cid).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'channel_id=eq.'+cid},async p=>{if(S.msgs.some(m=>m.id==p.new.id))return;await prof([p.new.user_id]);S.msgs.push(p.new);addMsg(p.new)}).subscribe()}

/* rendering */
const bnr=(u,c)=>u?`background:url('${esc(u)}') center/cover`:`background:${esc(c)}`;
const av=(u,s=40)=>u?.avatar_url?`<img class=av src="${esc(u.avatar_url)}" style="width:${s}px;height:${s}px;object-fit:cover">`:`<div class=av style="background:${esc(u?.color||'#5865f2')};width:${s}px;height:${s}px;font-size:${s/2.2}px">${esc((u?.username||'?')[0].toUpperCase())}</div>`;
const ico=(v,s=48)=>v.icon_url?`<img class="av sq" src="${esc(v.icon_url)}" style="width:${s}px;height:${s}px;object-fit:cover">`:`<div class="av sq" style="background:var(--acc);width:${s}px;height:${s}px;font-size:${s/2.4}px">${esc(v.name.slice(0,2))}</div>`;
const isImg=t=>/^https?:\/\/\S+$/.test(t)&&(/\.(gif|webp|png|jpe?g)(\?|$)/i.test(t)||/klipy\.com/.test(t));
const msgH=m=>{const u=S.P[m.user_id];return `<div class=msg id="m${m.id}"><span class=pt onclick="prf('${m.user_id}')">${av(u)}</span><div><b onclick="prf('${m.user_id}')">${esc(u?.username||'unknown')}</b> <small>${new Date(m.created_at).toLocaleString()}</small><div class=ct>${isImg(m.content)?`<img class=gif src="${esc(m.content)}">`:esc(m.content)}</div></div>${m.user_id==S.uid?`<i class=x title="Delete message" onclick="del(${m.id})">✕</i>`:''}</div>`};

const fo=f=>f.a==S.uid?f.b:f.a;
async function loadFr(){S.fr=(await sb.from('friendships').select('*')).data||[];await prof(S.fr.flatMap(f=>[f.a,f.b]))}
function presence(){if(S.pc)sb.removeChannel(S.pc);S.pc=sb.channel('orbit-online',{config:{presence:{key:S.uid}}}).on('presence',{event:'sync'},()=>{S.on=new Set(Object.keys(S.pc.presenceState()));if(!S.me||$('.set,.ov'))return;const v=$('#in')?.value;render();if(v)$('#in').value=v}).subscribe(async s=>{if(s=='SUBSCRIBED'&&LS('inv')!==true)await S.pc.track({t:Date.now()})})}
function render(){const home=S.sid=='home',sv=S.servers.find(x=>x.id==S.sid),own=sv?.owner_id==S.uid,ch=(home?S.dms:S.chans).find(x=>x.id==S.cid),oth=c=>S.P[c.dm_users.find(i=>i!=S.uid)];
 const acc=S.fr.filter(f=>f.status=='accepted'),pen=S.fr.filter(f=>f.status=='pending'),inc=pen.filter(f=>f.b==S.uid).length;
 const rail=`<div class=rail><div class="ri ${home?'on':''}" onclick="go('home')" title="Home">${LOGO}</div><hr>${S.servers.map(x=>`<div class="ri ${x.id==S.sid?'on':''}" onclick="go('${x.id}')" title="${esc(x.name)}">${x.icon_url?`<img src="${esc(x.icon_url)}">`:esc(x.name.slice(0,2))}</div>`).join('')}<div class="ri add" onclick="srvModal()" title="Add a server">+</div></div>`;
 const chl=(c,i)=>c.kind=='voice'?`<div class=ch onclick="toast('Voice channels are coming soon!')">🔊 ${esc(c.name)}</div>`:`<div class="ch ${c.id==S.cid?'on':''}" onclick="opn('${c.id}')"># ${esc(c.name)}</div>`;
 const side=home?`<div class=sh>Orbit</div><div class=sl><div class="ch ${S.cid?'':'on'}" onclick="S.cid=null;render()">👥 Friends${inc?` <span class=bdg>${inc}</span>`:''}</div><div class=lbl>Direct messages</div>${S.dms.map(c=>`<div class="ch ${c.id==S.cid?'on':''}" onclick="opn('${c.id}')">${av(oth(c),28)} ${esc(oth(c)?.username)}</div>`).join('')||'<p class=mut style="padding:8px">No direct messages yet.</p>'}</div>`
  :`<div class="sh pointer" onclick="srvSet()">${esc(sv?.name)}<span class=mut style="margin-left:auto">⚙</span></div><div class=sl><div class=lbl>Text channels ${own?'<span onclick="chModal()" title="Create channel">+</span>':''}</div>${S.chans.filter(c=>c.kind!='voice').map(chl).join('')}<div class=lbl>Voice channels</div>${S.chans.filter(c=>c.kind=='voice').map(chl).join('')}</div>`;
 const nm=ch?(home?'@'+esc(oth(ch)?.username):'# '+esc(ch.name)):'';
 let main,mem='';
 if(ch)main=`<div class=hd>${nm}</div><div id=msgs>${S.msgs.map(msgH).join('')}</div><form class=bar onsubmit="return send(event)"><div id=pkw></div><div class=ib><input id=in autocomplete=off placeholder="Message ${nm}"><button type=button class=ic onclick="tpk('g')">GIF</button><button type=button class=ic onclick="tpk('e')">☺</button></div></form>`;
 else if(home){const list=S.tab=='all'?acc:S.tab=='on'?acc.filter(f=>S.on.has(fo(f))):pen,t=[['on','Online'],['all','All'],['pen','Pending']];
  const row=f=>{const i=fo(f),u=S.P[i],pn=f.status=='pending',inb=pn&&f.b==S.uid;return `<div class=fr><span class=pt onclick="prf('${i}')">${av(u,36)}<i class="dot ${S.on.has(i)?'g':''}"></i></span><div class=fi><b>${esc(u?.username)}</b><div class=mut>${pn?(inb?'Incoming friend request':'Outgoing friend request'):S.on.has(i)?'Online':'Offline'}</div></div>${inb?`<button class=ic onclick="fa(${f.id},'ok')" title=Accept>✓</button>`:pn?'':`<button class=ic onclick="startDM('${i}')" title=Message>💬</button>`}<button class=ic onclick="fa(${f.id},'no')" title="${pn?'Decline':'Remove friend'}">✕</button></div>`};
  main=`<div class=hd>👥 Friends<div class=tabs>${t.map(([k,n])=>`<button class="tb ${S.tab==k?'on':''}" onclick="S.tab='${k}';render()">${n}${k=='pen'&&pen.length?` <span class=bdg>${pen.length}</span>`:''}</button>`).join('')}<button class="btn ${S.tab=='add'?'ghost':''}" style="padding:4px 10px" onclick="S.tab='add';render()">Add Friend</button></div></div>`+

   :`<div class=fl><div class=lbl>${t.find(x=>x[0]==S.tab)?.[1]} — ${list.length}</div>${list.map(row).join('')||'<p class=mut style="padding:24px 8px">Nothing here yet. Use Add Friend to find people by username.</p>'}</div>`);
  const act=acc.map(fo).filter(i=>S.on.has(i));
  mem=`<div class=mem style="width:300px"><h3 style="padding:8px">Active Now</h3>${act.map(i=>`<div class=ch onclick="prf('${i}')">${av(S.P[i],36)}<div><b style="color:var(--tx)">${esc(S.P[i]?.username)}</b><div style="font-size:12px">Online</div></div></div>`).join('')||'<p class=mut style="padding:8px;font-size:13px">Quiet for now. When a friend is online, they show up here.</p>'}</div>`}
 else main=`<div class=hd>${esc(sv?.name)}</div><div class=mid><p class=mut>This server has no text channels yet.</p></div>`;
 if(!home){const on=S.mem.filter(i=>S.on.has(i)),off=S.mem.filter(i=>!S.on.has(i)),mr=i=>`<div class="ch ${S.on.has(i)?'':'dim'}" onclick="prf('${i}')">${av(S.P[i],28)} ${esc(S.P[i]?.username)}</div>`;
  mem=`<div class=mem><div class=lbl>Online — ${on.length}</div>${on.map(mr).join('')}<div class=lbl>Offline — ${off.length}</div>${off.map(mr).join('')}</div>`}
 app.innerHTML=rail+`<div class=side>${side}<div class=me>${av(S.me,32)}<b onclick="prf('${S.uid}')">${esc(S.me.username)}</b><i onclick="settings()" title="User settings">⚙</i></div></div><div class=main>${main}</div>`+mem;
 const b=$('#msgs');if(b)b.scrollTop=b.scrollHeight;$('#in')?.focus()}

/* actions */
async function post(t){const r=await sb.from('messages').insert({channel_id:S.cid,content:t}).select().single();
 if(r.error)alert(r.error.message);else if(!S.msgs.some(m=>m.id==r.data.id)){S.msgs.push(r.data);addMsg(r.data)}}
async function send(e){e.preventDefault();const i=$('#in'),t=i.value.trim();if(!t)return false;i.value='';await post(t);return false}
async function del(id){if((await sb.from('messages').delete().eq('id',id)).error)return;$('#m'+id)?.remove();S.msgs=S.msgs.filter(m=>m.id!=id)}
async function startDM(id){const r=await sb.rpc('open_dm',{other:id});if(r.error){alert(r.error.message);return}closeM();await go('home');opn(r.data)}
async function addF(e){e.preventDefault();const r=await sb.rpc('add_friend',{uname:$('#du').value});$('#fm').textContent=r.error?r.error.message:r.data;await loadFr();return false}
async function fa(id,a){await(a=='ok'?sb.from('friendships').update({status:'accepted'}).eq('id',id):sb.from('friendships').delete().eq('id',id));await loadFr();render()}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),3000)}
async function up(el,pre){const f=el.files[0];if(!f)return null;const p=`${S.uid}/${pre}-${Date.now()}.${f.type.split('/')[1]}`,r=await sb.storage.from('media').upload(p,f,{contentType:f.type});
 if(r.error){alert(r.error.message);return null}return sb.storage.from('media').getPublicUrl(p).data.publicUrl}

/* gif + emoji picker (Klipy) */
const KK='SwQa4RtqIdbdT1bzUI6opCkN3LpEr6x55MhJfGP0T1ImyihnN9uqDCO0V4XgCeqF',EMS=[...new Intl.Segmenter().segment('😀😃😄😁😆😅😂🤣😊😇🙂😉😍🥰😘😋😛😜🤪🤔🤨😐😑🙄😏😴😎🤓🥳😭😢😤😡🤯😱🥺🤗🫡👍👎👌✌️🤞🤝🙏👏🙌💪👀🧠❤️🧡💛💚💙💜🖤💔🔥✨🎉🎂🎮🚀🌟⭐🌈🍕🍔🍟🍩🍪☕🐶🐱🐸🦊🐻🐧🦄💀👻🤖🛸🌍🌙☀️⚡')].map(x=>x.segment);
async function gifs(q){try{const j=await(await fetch(`https://api.klipy.com/api/v1/${KK}/gifs/${q?'search':'trending'}?per_page=24&customer_id=${S.uid}${q?'&q='+encodeURIComponent(q):''}`)).json(),
 g=(f,...k)=>k.map(s=>f?.[s]?.gif?.url||f?.[s]?.webp?.url).find(Boolean);return(j.data?.data||[]).map(x=>({t:g(x.file,'sm','md','xs','hd'),u:g(x.file,'md','hd','sm')})).filter(x=>x.t&&x.u)}catch(e){return[]}}
function tpk(t){$('#pkw').innerHTML&&S.pk==t?closePk():pk(t)}
function closePk(){S.pk=null;$('#pkw').innerHTML=''}
function pk(t){S.pk=t;$('#pkw').innerHTML=`<div id=pk><div class=th style="padding:10px"><button type=button class="btn ${t=='g'?'':'ghost'}" onclick="pk('g')">GIFs</button><button type=button class="btn ${t=='e'?'':'ghost'}" onclick="pk('e')">Emoji</button></div>`+
 (t=='e'?`<div class=eg>${EMS.map(e=>`<span onclick="emo('${e}')">${e}</span>`).join('')}</div>`:`<div style="padding:0 10px"><input id=gq placeholder="Search Klipy" oninput="clearTimeout(S.gt);S.gt=setTimeout(gs,400)"></div><div class=gg id=gg>Loading...</div>`)+`</div>`;if(t=='g'){gs();$('#gq').focus()}}
async function gs(){S.gl=await gifs($('#gq')?.value.trim());const g=$('#gg');if(g)g.innerHTML=S.gl.length?S.gl.map((x,i)=>`<img src="${esc(x.t)}" onclick="sendGif(${i})">`).join(''):'<p class=mut>No GIFs found.</p>'}
async function sendGif(i){const u=S.gl[i].u;closePk();await post(u)}
function emo(e){const i=$('#in');i.value+=e;i.focus()}

/* servers */
const modal=h=>$('#md').innerHTML=h,closeM=()=>$('#md').innerHTML='';
addEventListener('keydown',e=>e.key=='Escape'&&closeM());
function srvModal(st=0){S.nf=null;modal(`<div class=ov onclick="event.target==this&&closeM()"><div class=box style="text-align:center">`+(st==0?`<h2>Create a server</h2><p class=mut>Your server is where you and your friends hang out.</p><button class=btn onclick="srvModal(1)">Create My Own</button><label style="text-align:left">Have an invite code?<input id=code placeholder="e.g. 3f9a1c2b"></label><button class="btn ghost" onclick="joinS()">Join Server</button>`
 :`<h2>Customize Your Server</h2><p class=mut>Give your new server a personality with a name and an icon. You can always change it later.</p><label class=upl style="justify-self:center"><input type=file accept="image/*" hidden onchange="S.nf=this.files[0];$('#pv').innerHTML='<img src='+URL.createObjectURL(S.nf)+'>'"><div id=pv class=pv>📷<small>Upload</small></div></label><label style="text-align:left">Server name<input id=nn maxlength=40 value="${esc(S.me.username)}'s server"></label><div class=btnrow><a onclick="srvModal(0)">Back</a><button class=btn onclick="mkS()">Create</button></div>`)+`</div></div>`)}
async function mkS(){const n=$('#nn').value.trim();if(!n)return;const r=await sb.rpc('create_server',{n});if(r.error)return alert(r.error.message);
 if(S.nf){const u=await up({files:[S.nf]},'srv');if(u)await sb.from('servers').update({icon_url:u}).eq('id',r.data)}await addS(r.data)}
async function joinS(){const r=await sb.rpc('join_server',{code:$('#code').value});if(r.error)return alert(r.error.message);await addS(r.data)}
async function addS(id){const m=await sb.from('servers').select('*').eq('id',id).single();closeM();if(!S.servers.some(x=>x.id==id))S.servers.push(m.data);go(id)}
function chModal(){modal(`<div class=ov onclick="event.target==this&&closeM()"><div class=box><h2>Create channel</h2><form onsubmit="return mkc(event)"><label>Type<select id=ck><option value=text># Text</option><option value=voice>🔊 Voice</option></select></label><label>Name<input id=cn placeholder="new-channel" required maxlength=30></label><br><button class=btn>Create channel</button></form></div></div>`)}
async function mkc(e){e.preventDefault();const n=$('#cn').value.trim().toLowerCase().replace(/\s+/g,'-'),k=$('#ck').value,r=await sb.from('channels').insert({server_id:S.sid,name:n,kind:k}).select().single();
 if(r.error)alert(r.error.message);else{closeM();S.chans.push(r.data);k=='voice'?render():opn(r.data.id)}return false}
async function ssave(p={}){const sv=S.servers.find(x=>x.id==S.sid),r=await sb.from('servers').update({name:($('#sn')?.value||sv.name).trim(),description:$('#sd')?.value??sv.description,...p}).eq('id',sv.id).select().single();
 if(r.error)return alert(r.error.message);Object.assign(sv,r.data);render();srvSet('pf')}
async function sup(el,c){const u=await up(el,'s');if(u)ssave({[c]:u})}
async function rmS(own){if(!confirm(own?'Delete this server permanently?':'Leave this server?'))return;
 await(own?sb.from('servers').delete().eq('id',S.sid):sb.from('members').delete().eq('server_id',S.sid).eq('user_id',S.uid));S.servers=S.servers.filter(x=>x.id!=S.sid);closeM();go('home')}
const shell=(nav,pg,tab,fn,head='')=>modal(`<div class=set><nav>${head}${nav.map(([k,n])=>`<div class="${k==tab?'on':''}" onclick="${fn}('${k}')">${n}</div>`).join('')}</nav><section>${pg}</section><div class=esc onclick="closeM()" title="Close (Esc)">✕</div></div>`);
const upb=(l,c,fn,rm)=>`<div class=th><label class="btn upl">${l}<input type=file accept="image/*" hidden onchange="${fn}(this,'${c}')"></label><button class="btn ghost" onclick="${rm}">Remove</button></div>`;
function srvSet(tab){const sv=S.servers.find(x=>x.id==S.sid),own=sv.owner_id==S.uid;tab=tab||(own?'pf':'inv');
 const sw=['#3ba99c','#ff1493','#e51c1c','#e87722','#e8c233','#7b3fa0','#0aa0ff','#40e0c8','#4a7a00','#555555'];
 const pg={pf:`<h2>Server Profile</h2><p class=mut>Customize how your server appears to members.</p><div class=two><div style="flex:1;min-width:260px"><label>Name<input id=sn value="${esc(sv.name)}" maxlength=40></label><label>Icon (image or GIF)</label>${upb('Change Server Icon','icon_url','sup','ssave({icon_url:null})')}<label>Banner</label><div class=sws>${sw.map(c=>`<div class=sw style="background:linear-gradient(${c},#0008)" onclick="ssave({banner_color:'${c}',banner_url:null})"></div>`).join('')}</div><div class=th style="margin-top:8px"><label class="btn upl">Upload banner image or GIF<input type=file accept="image/*" hidden onchange="sup(this,'banner_url')"></label></div><label>Description<textarea id=sd maxlength=300 placeholder="Tell the world a bit about this server.">${esc(sv.description)}</textarea></label><br><button class=btn onclick="ssave()">Save changes</button></div>
  <div style="width:290px"><div class=card><div class=bn style="${bnr(sv.banner_url,sv.banner_color)}"></div><div class=av2>${ico(sv,72)}</div><div class=pb><h3>${esc(sv.name)}</h3><span class=mut>${S.mem.length} Members · Est. ${new Date(sv.created_at).toLocaleDateString(undefined,{month:'short',year:'numeric'})}</span><div>${esc(sv.description)}</div></div></div></div></div>`,
  inv:`<h2>Invites</h2><p class=mut>Share this code. People join with the + button.</p><div class=row><b style="font-size:26px">${sv.invite}</b><button class=btn onclick="navigator.clipboard.writeText('${sv.invite}');this.textContent='Copied!'">Copy</button></div>`,
  del:`<h2>Delete Server</h2><p class=mut>This permanently deletes ${esc(sv.name)} with all its channels and messages.</p><button class="btn red" onclick="rmS(true)">Delete Server</button>`,
  lv:`<h2>Leave Server</h2><p class=mut>You can rejoin later with an invite code.</p><button class="btn red" onclick="rmS(false)">Leave Server</button>`};
 shell([...(own?[['pf','Server Profile']]:[]),['inv','Invites'],own?['del','Delete Server']:['lv','Leave Server']],pg[tab],tab,'srvSet',`<p class=mut style="padding:0 10px 8px;font-size:13px">${esc(sv.name)}</p>`)}

/* profiles + user settings */
const pcard=(u,btn='',note=false)=>`<div class=card><div class=bn style="${bnr(u.banner_url,u.color)}"></div><div class=av2>${av(u,84)}</div><div class=pb><div class=btns>${btn}</div><h2>${esc(u.username)}</h2><label>About me</label><div>${esc(u.bio)||'<span class=mut>Nothing here yet.</span>'}</div><label>Member since</label><div>${new Date(u.created_at).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})}</div>${note?`<label>Note (only visible to you)</label><textarea placeholder="Click to add a note" oninput="LS('n${u.id}',this.value)">${esc(LS('n'+u.id)||'')}</textarea>`:''}</div></div>`;
async function prf(id){await prof([id]);const u=S.P[id];if(u)modal(`<div class=ov onclick="event.target==this&&closeM()">${pcard(u,id==S.uid?`<button class=btn onclick="settings('pr')">✎ Edit Profile</button>`:`<button class=btn onclick="startDM('${id}')">Message</button>`,true)}</div>`)}
async function pset(p){const r=await sb.from('profiles').update({color:$('#pc')?.value||S.me.color,bio:$('#pb')?.value??S.me.bio,...p}).eq('id',S.uid).select().single();if(r.error)return alert(r.error.message);S.me=S.P[S.uid]=r.data;render();settings('pr')}
async function pup(el,c){const u=await up(el,c);if(u)pset({[c]:u})}
async function tgl(el){el.classList.toggle('on');S.me.allow_dms=el.classList.contains('on');await sb.from('profiles').update({allow_dms:S.me.allow_dms}).eq('id',S.uid)}
function tglL(k,el){el.classList.toggle('on');const v=el.classList.contains('on');LS(k,v);if(k=='inv')v?S.pc?.untrack():S.pc?.track({t:Date.now()});theme()}
const tg=(t,d,on,fn)=>`<div class=row><div><b>${t}</b><div class=mut>${d}</div></div><div class="tg ${on?'on':''}" onclick="${fn}"></div></div>`;
function settings(tab='acc'){const T={...D,...LS('theme')};
 const pg={
 acc:`<h2>My Account</h2><div class=row><div><b>Username</b><div class=mut>${esc(S.me.username)}</div></div></div><div class=row><div><b>Email</b><div class=mut>${esc(S.email)}</div></div></div><button class="btn red" onclick="closeM();sb.auth.signOut()">Log out</button>`,
 pr:`<h2>Profiles</h2><div class=two><div style="flex:1;min-width:260px"><label>Avatar (PNG, JPG or GIF)</label>${upb('Change Avatar','avatar_url','pup','pset({avatar_url:null})')}<label>Banner (image or GIF)</label>${upb('Change Banner','banner_url','pup','pset({banner_url:null})')}<label>Profile color<input type=color id=pc value="${esc(S.me.color)}"></label><label>About me<textarea id=pb maxlength=200>${esc(S.me.bio)}</textarea></label><br><button class=btn onclick="pset({})">Save changes</button></div><div style="width:290px">${pcard(S.me)}</div></div>`,
 soc:`<h2>Content & Social</h2><label>Social permissions</label>${tg('Direct messages','Allow DMs from other Orbit members.',S.me.allow_dms,'tgl(this)')}`,
 priv:`<h2>Status & Privacy</h2>${tg('Appear offline','Hide your online status from everyone.',LS('inv')===true,"tglL('inv',this)")}`,
 app:`<h2>Appearance</h2><label>Theme</label><div class=th>${[['dark','Dark'],['darker','Darker'],['light','Light'],['custom','Custom']].map(([k,n])=>`<button class="btn ${T.m==k?'':'ghost'}" onclick="setT({m:'${k}'});settings('app')">${n}</button>`).join('')}</div>
  <label>Accent color<input type=color value="${T.a}" oninput="setT({a:this.value})"></label><label>Custom background color<input type=color value="${T.b}" oninput="setT({m:'custom',b:this.value})"></label><p class=mut style="margin:12px 0">Picking a background color switches you to your custom theme.</p><label>Chat</label>${tg('Compact mode','Tighter message spacing.',LS('compact')===true,"tglL('compact',this)")}`};
 shell([['acc','My Account'],['pr','Profiles'],['soc','Content & Social'],['priv','Status & Privacy'],['app','Appearance']],pg[tab],tab,'settings')}
theme();
</script></body></html>
